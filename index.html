<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clássicos - Filmes Anos 80</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="theme-switch-container" id="theme-switch-container">
            <div class="theme-switch" id="theme-switch">
                <div class="theme-option" data-theme-value="80s"><span>80s'</span></div>
                <div class="theme-option" data-theme-value="light"><span>Light</span></div>
                <div class="theme-option" data-theme-value="dark"><span>Dark</span></div>
                <div class="theme-selection-slider"></div>
            </div>
        </div>
        <h1>🎬 Clássicos das telas</h1>
        <p class="subtitle">Do cinema pra sala</p>
        <div class="search-area">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Buscar por nome ou descrição do filme..."
            >
            <button onclick="iniciarBusca()">Buscar</button>
        </div>
    </header>

    <main>
        <section class="card-container" id="card-container">
            <!-- Cards serão inseridos aqui dinamicamente -->
        </section>
    </main>

    <footer>
        <p>Links úteis:</p>
        <ul>
            <li><a href="https://github.com/dougscodesontheloose" target="_blank">Github</a></li>
            <li><a href="https://www.linkedin.com/in/dougpmoura/" target="_blank">LinkedIn</a></li>
            <li><a href="https://www.imdb.com" target="_blank">IMDb</a></li>
            <li><a href="https://www.rottentomatoes.com" target="_blank">Rotten Tomatoes</a></li>
            <li><a href="https://letterboxd.com" target="_blank">Letterboxd</a></li>
            <li><a href="https://www.themoviedb.org" target="_blank">The Movie Database</a></li>
        </ul>
        <p class="footer-signature">Feito com amor ❤️ ao cinema. By Doug. By Imersão Alura - Desenvolvimento Web com o Google.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
